name: daily
on:
  # build every day at 4:00 AM UTC
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  TARGET_PYTHON_VERSION: '3.11'

jobs:
  smoke-test-integration:
    timeout-minutes: 10
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
    - uses: actions/setup-python@v7
      with:
        python-version: '${{ env.TARGET_PYTHON_VERSION }}'
    - name: Create venv, install tox
      run: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Run smoke tests (ECS, integration environment)
      env:
        FUNCX_SMOKE_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
        FUNCX_SMOKE_CLIENT_SECRET: ${{ secrets.API_CLIENT_SECRET_INTEGRATION }}
        GLOBUS_SDK_ENVIRONMENT: "intregration"
      run: |
        source .venv/bin/activate
        cd smoke_tests
        make integration
